name: Deploy to Pinata via SDK

on:
  push:
    branches:
      - v4

jobs:
  upload:
    runs-on: ubuntu-latest
    environment: github-pages  # ← ✅ 必須！

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz site
        run: npx quartz build

      - name: Upload folder to Pinata via SDK
        run: node .github/scripts/uploadFolder.mjs
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
